<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
<title id="title">COURTSIDE draft entity relationship diagram</title><desc id="desc">Six planned entities: users, courts, runs, run members, saved courts, and reviews, connected by one-to-many and junction relationships.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#e99a16"/></marker></defs>
<rect width="1400" height="850" fill="#f6f7f9"/><text x="60" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#101a2b">COURTSIDE · Draft ERD</text><text x="60" y="72" font-family="Arial,sans-serif" font-size="14" fill="#657083">Milestone 1 planning artifact · proposed keys and relationships</text>
<!-- relationship connectors -->
<g fill="none" stroke="#e99a16" stroke-width="2.5" marker-end="url(#arrow)">
<path d="M410 145 H520"/><path d="M870 145 H980"/><path d="M1160 330 V470"/><path d="M980 570 H870"/><path d="M590 330 V470"/><path d="M240 330 V470"/><path d="M410 265 C470 365 460 420 520 520"/><path d="M690 330 C700 390 750 420 750 470"/>
</g>
<g font-family="Arial,sans-serif" font-size="12" fill="#7b520c" font-weight="700"><text x="435" y="132">creates / saves</text><text x="894" y="132">hosts</text><text x="1170" y="405">includes</text><text x="886" y="558">memberships</text><text x="600" y="405">saved by</text><text x="250" y="405">writes</text><text x="410" y="385">reviews</text><text x="704" y="405">receives</text></g>
<g><rect x="60" y="100" width="350" height="230" rx="12" fill="#ffffff" stroke="#dce1e8" stroke-width="1.5"/><path d="M72 100 H398 Q410 100 410 112 V148 H60 V112 Q60 100 72 100" fill="#101a2b"/><text x="78" y="130" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff">USERS</text><text x="78" y="175" font-family="Arial,sans-serif" font-size="13.5" fill="#29374b">PK  user_id : INT</text><text x="78" y="199" font-family="Arial,sans-serif" font-size="13.5" fill="#29374b">full_name : VARCHAR</text><text x="78" y="223" font-family="Arial,sans-serif" font-size="13.5" fill="#29374b">email : VARCHAR (UNIQUE)</text><text x="78" y="247" font-family="Arial,sans-serif" font-size="13.5" fill="#29374b">password_hash : VARCHAR</text><text x="78" y="271" font-family="Arial,sans-serif" font-size="13.5" fill="#29374b">role : ENUM(player, admin)</text><text x="78" y="295" font-family="Arial,sans-serif" font-size="13.5" fill="#29374b">created_at : DATETIME</text></g><g><rect x="520" y="100" width="350" height="230" rx="12" fill="#ffffff" stroke="#dce1e8" stroke-width="1.5"/><path d="M532 100 H858 Q870 100 870 112 V148 H520 V112 Q520 100 532 100" fill="#101a2b"/><text x="538" y="130" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff">COURTS</text><text x="538" y="175" font-family="Arial,sans-serif" font-size="13.5" fill="#29374b">PK  court_id : INT</text><text x="538" y="199" font-family="Arial,sans-serif" font-size="13.5" fill="#29374b">name, address, city : VARCHAR</text><text x="538" y="223" font-family="Arial,sans-serif" font-size="13.5" fill="#29374b">latitude, longitude : DECIMAL</text><text x="538" y="247" font-family="Arial,sans-serif" font-size="13.5" fill="#29374b">surface_type : ENUM</text><text x="538" y="271" font-family="Arial,sans-serif" font-size="13.5" fill="#29374b">is_indoor : BOOLEAN</text><text x="538" y="295" font-family="Arial,sans-serif" font-size="13.5" fill="#29374b">amenities, source, external_id</text></g><g><rect x="980" y="100" width="350" height="230" rx="12" fill="#ffffff" stroke="#dce1e8" stroke-width="1.5"/><path d="M992 100 H1318 Q1330 100 1330 112 V148 H980 V112 Q980 100 992 100" fill="#101a2b"/><text x="998" y="130" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff">RUNS</text><text x="998" y="175" font-family="Arial,sans-serif" font-size="13.5" fill="#29374b">PK  run_id : INT</text><text x="998" y="199" font-family="Arial,sans-serif" font-size="13.5" fill="#29374b">FK  court_id → COURTS</text><text x="998" y="223" font-family="Arial,sans-serif" font-size="13.5" fill="#29374b">FK  creator_user_id → USERS</text><text x="998" y="247" font-family="Arial,sans-serif" font-size="13.5" fill="#29374b">title, starts_at</text><text x="998" y="271" font-family="Arial,sans-serif" font-size="13.5" fill="#29374b">max_players : INT</text><text x="998" y="295" font-family="Arial,sans-serif" font-size="13.5" fill="#29374b">skill_level, status, notes</text></g><g><rect x="980" y="470" width="350" height="210" rx="12" fill="#ffffff" stroke="#dce1e8" stroke-width="1.5"/><path d="M992 470 H1318 Q1330 470 1330 482 V518 H980 V482 Q980 470 992 470" fill="#101a2b"/><text x="998" y="500" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff">RUN_MEMBERS</text><text x="998" y="545" font-family="Arial,sans-serif" font-size="13.5" fill="#29374b">PK  run_member_id : INT</text><text x="998" y="569" font-family="Arial,sans-serif" font-size="13.5" fill="#29374b">FK  run_id → RUNS</text><text x="998" y="593" font-family="Arial,sans-serif" font-size="13.5" fill="#29374b">FK  user_id → USERS</text><text x="998" y="617" font-family="Arial,sans-serif" font-size="13.5" fill="#29374b">membership_status : ENUM</text><text x="998" y="641" font-family="Arial,sans-serif" font-size="13.5" fill="#29374b">joined_at : DATETIME</text><text x="998" y="665" font-family="Arial,sans-serif" font-size="13.5" fill="#29374b">UNIQUE (run_id, user_id)</text></g><g><rect x="520" y="470" width="350" height="210" rx="12" fill="#ffffff" stroke="#dce1e8" stroke-width="1.5"/><path d="M532 470 H858 Q870 470 870 482 V518 H520 V482 Q520 470 532 470" fill="#101a2b"/><text x="538" y="500" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff">SAVED_COURTS</text><text x="538" y="545" font-family="Arial,sans-serif" font-size="13.5" fill="#29374b">PK  saved_court_id : INT</text><text x="538" y="569" font-family="Arial,sans-serif" font-size="13.5" fill="#29374b">FK  user_id → USERS</text><text x="538" y="593" font-family="Arial,sans-serif" font-size="13.5" fill="#29374b">FK  court_id → COURTS</text><text x="538" y="617" font-family="Arial,sans-serif" font-size="13.5" fill="#29374b">created_at : DATETIME</text><text x="538" y="641" font-family="Arial,sans-serif" font-size="13.5" fill="#29374b">UNIQUE (user_id, court_id)</text></g><g><rect x="60" y="470" width="350" height="210" rx="12" fill="#ffffff" stroke="#dce1e8" stroke-width="1.5"/><path d="M72 470 H398 Q410 470 410 482 V518 H60 V482 Q60 470 72 470" fill="#101a2b"/><text x="78" y="500" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff">REVIEWS</text><text x="78" y="545" font-family="Arial,sans-serif" font-size="13.5" fill="#29374b">PK  review_id : INT</text><text x="78" y="569" font-family="Arial,sans-serif" font-size="13.5" fill="#29374b">FK  user_id → USERS</text><text x="78" y="593" font-family="Arial,sans-serif" font-size="13.5" fill="#29374b">FK  court_id → COURTS</text><text x="78" y="617" font-family="Arial,sans-serif" font-size="13.5" fill="#29374b">rating : INT (1–5)</text><text x="78" y="641" font-family="Arial,sans-serif" font-size="13.5" fill="#29374b">comment : TEXT</text><text x="78" y="665" font-family="Arial,sans-serif" font-size="13.5" fill="#29374b">created_at, updated_at</text></g><text x="60" y="735" font-family="Arial,sans-serif" font-size="13" fill="#657083">Draft only. Review foreign keys, delete behavior, timestamp/timezone rules and constraints before implementing the MySQL schema in Milestone 2.</text><text x="60" y="758" font-family="Arial,sans-serif" font-size="13" fill="#657083">Password values are stored as hashes. Credentials and API keys do not belong in the ERD or source control.</text></svg>